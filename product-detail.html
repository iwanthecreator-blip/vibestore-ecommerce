<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Produk - VibeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-vibe shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-arrow-left"></i> Kembali</a>
            <div class="d-flex text-white">
                <i class="bi bi-share me-3"></i>
                <i class="bi bi-heart"></i>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800" class="img-fluid" alt="Product">
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3">
                    <span class="badge bg-danger mb-2">Terlaris</span>
                    <h2 class="fw-bold">Headset Gaming Vibe X-Pro</h2>
                    <div class="d-flex align-items-center mb-3">
                        <div class="text-warning me-2">
                            <i class="bi bi-star-fill"></i> 4.9
                        </div>
                        <span class="text-muted small">(120 Ulasan) | Terjual 500+</span>
                    </div>
                    
                    <h1 class="text-vibe fw-bold">Rp 500.000</h1>
                    <p class="text-muted">Dapatkan harga <strong>Rp 300.000</strong> dengan fitur Patungan.</p>
                    
                    <hr>
                    
                    <div class="card border-vibe bg-white rounded-4 shadow-sm mb-4">
                        <div class="card-body">
                            <h6 class="fw-bold text-vibe"><i class="bi bi-robot me-2"></i> Vibe AI Negotiator</h6>
                            <p class="small text-muted">Coba tawar harga? AI kami mungkin akan memberimu harga khusus!</p>
                            <div class="input-group mb-2">
                                <input type="number" id="negoInput" class="form-control" placeholder="Masukkan harga tawaran...">
                                <button class="btn btn-vibe" onclick="startNego()">Tawar</button>
                            </div>
                            <div id="negoResponse" class="small fw-semibold mt-2"></div>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <a href="checkout.html" class="btn btn-outline-primary w-100 py-3 rounded-pill fw-bold">Beli Langsung</a>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-vibe w-100 py-3 rounded-pill fw-bold" onclick="joinGroup('Vibe X-Pro')">Ajak Patungan</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
