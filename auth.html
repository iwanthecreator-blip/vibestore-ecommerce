<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke VibeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-bg d-flex align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card auth-card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-vibe">VibeStore</h2>
                            <p class="text-muted small">Satu akun untuk semua peran</p>
                        </div>

                        <ul class="nav nav-pills mb-4 justify-content-center bg-light rounded-pill p-1" id="authTab" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active rounded-pill px-4" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button">Masuk</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link rounded-pill px-4" id="register-tab" data-bs-toggle="pill" data-bs-target="#register" type="button">Daftar</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabContent">
                            <div class="tab-pane fade show active" id="login" role="tabpanel">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Email / Username</label>
                                        <input type="email" class="form-control rounded-3" placeholder="nama@email.com" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-bold">Password</label>
                                        <input type="password" class="form-control rounded-3" placeholder="••••••••" required>
                                    </div>
                                    <button type="submit" class="btn btn-vibe w-100 py-2 fw-bold">Masuk Sekarang</button>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="register" role="tabpanel">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Nama Lengkap</label>
                                        <input type="text" class="form-control rounded-3" placeholder="Contoh: Budi Santoso" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Daftar Sebagai</label>
                                        <select class="form-select rounded-3" id="roleSelect">
                                            <option value="pembeli">🛍️ Pembeli (Belanja & Patungan)</option>
                                            <option value="penjual">🏪 Penjual (Buka Toko)</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Email</label>
                                        <input type="email" class="form-control rounded-3" placeholder="nama@email.com" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold">Password</label>
                                        <input type="password" class="form-control rounded-3" placeholder="Buat password kuat" required>
                                    </div>
                                    <button type="submit" class="btn btn-vibe w-100 py-2 fw-bold">Buat Akun</button>
                                </form>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <p class="small text-muted">Atau masuk dengan</p>
                            <div class="d-flex justify-content-center gap-3">
                                <button class="btn btn-outline-danger rounded-circle p-2"><i class="bi bi-google"></i></button>
                                <button class="btn btn-outline-primary rounded-circle p-2"><i class="bi bi-facebook"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3 text-white-50">
                    <small>&copy; 2025 VibeStore Ecosystem</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
