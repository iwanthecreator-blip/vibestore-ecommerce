<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Feed - Tren Terbaru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-vibe sticky-top">
        <div class="container text-center">
            <span class="navbar-brand mx-auto fw-bold">Vibe Feed</span>
        </div>
    </nav>

    <div class="container my-3 pb-5">
        <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
            <div class="p-3 d-flex align-items-center">
                <img src="https://ui-avatars.com/api/?name=Gamer+Store" class="rounded-circle me-2" width="40">
                <h6 class="mb-0 fw-bold">Gamer Store ID</h6>
            </div>
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600" class="img-fluid" alt="Feed">
            <div class="card-body">
                <div class="d-flex gap-3 mb-2">
                    <i class="bi bi-heart fs-4"></i>
                    <i class="bi bi-chat fs-4"></i>
                    <i class="bi bi-share fs-4"></i>
                </div>
                <p class="mb-1"><strong>Gamer Store ID</strong> Restok lagi nih Keyboard Mechanical RGB! Yuk patungan biar dapet harga 200rb aja.</p>
                <small class="text-muted">2 jam yang lalu</small>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
            <div class="p-3 d-flex align-items-center">
                <img src="https://ui-avatars.com/api/?name=Fashion+Vibe" class="rounded-circle me-2" width="40">
                <h6 class="mb-0 fw-bold">Fashion Vibe</h6>
            </div>
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=600" class="img-fluid" alt="Feed">
            <div class="card-body">
                <div class="d-flex gap-3 mb-2">
                    <i class="bi bi-heart-fill text-danger fs-4"></i>
                    <i class="bi bi-chat fs-4"></i>
                    <i class="bi bi-share fs-4"></i>
                </div>
                <p class="mb-1"><strong>Fashion Vibe</strong> Koleksi kaos oversized terbaru sudah tersedia! Klik link di bio.</p>
                <small class="text-muted">5 jam yang lalu</small>
            </div>
        </div>
    </div>

    </body>
</html>
